background: |
  Founded in 2025, Hami (meaning we) is a storytelling lab and design studio based in India. What began as a passion project has evolved into a studio that seamlessly transitions between brand systems, user experiences, and experimental narratives, always creating work that embodies depth, clarity, and quiet precision.

  We believe design should be: ➀ Playful — Bringing delight in ways both unexpected and intentional. ➁ Contextual, not trend-driven — Every challenge is unique, shaped by its own environment, and deserves a solution that is backed by thorough understanding of the context. ➂ Impactful — Adding meaning, joy, and lasting value to everyday interactions. ➃ Conversational, not just communicative — Design should spark dialogue, not just send a message. ➄ Ever-evolving — A living, breathing process of learning and refinement.

  Our work is future-facing, inclusive, rooted in sustainability, and deeply connected to local contexts, with the aim of creating meaningful, positive impact.

alignment: |
  In a time when communities that do not fit dominant narratives are often misunderstood or reduced to spectacle, this project asks how might we notice points of overlap rather than difference. How might we see in someone else’s rituals, values, and everyday choices a reflection of our own.
